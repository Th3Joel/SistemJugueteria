# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "final" ]
  pull_request:
    branches: [ "final" ]

jobs:

  build:
    runs-on: self-hosted #ubuntu-latest ejecuta en la nube
    steps:
    - uses: actions/checkout@v4

    #- name: Set up Go
   #   uses: actions/setup-go@v4
  #    with:
 #       go-version: '1.20'
    # - name: apt update
    #   run: sudo apt update
    # - name: install bun js
    #   run: sudo snap install bun-js
    # - name: install go
    #   run: sudo snap install go --classic
    - name: Install dependencies frontend
      run: cd web && bun install
    - name: Install dependencies backend
      run: go mod tidy
    - name: Build frontend
      run: cd web && bun run build
    - name: Build backend
      run: go build -ldflags="-s -w" -o sis 
    - name: Remove files unused
      run: find . -type f ! -name 'sis' ! -name 'Dockerfile' ! -name 'docker-compose.yaml' -exec rm -rf {} +

